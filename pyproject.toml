[project]
name = "warsaw-properties"
version = "0.1.0"
description = "Automated pipeline for scraping and normalizing real estate listings from the Warsaw market"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "httpx>=0.28.1",
    "numpy>=2.3",
    "pandas>=2.3",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.50",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
