services:
  # Run subcommands explicitly:
  #   docker compose run --rm scraper scrape --resume
  #   docker compose run --rm scraper clean
  #   docker compose run --rm scraper export SALE -o /data/warsaw_all_sales.csv
  #
  # `docker compose up` falls back to `--help` from the Dockerfile CMD so it
  # never starts a real scrape unintentionally.
  scraper:
    build: .
    image: warsaw-properties:latest
    container_name: warsaw-properties-scraper
    env_file:
      - path: .env
        required: false
    environment:
      WP_DATABASE_URL: sqlite:////data/properties.db
      WP_DATA_DIR: /data
    volumes:
      - ./data:/data
